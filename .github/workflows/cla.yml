name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

jobs:
  CLAssistant:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      statuses: write
    # Only run on PRs from forks or external contributors, not the owner
    if: github.actor != 'KaranamJyothirmayi'
    steps:
      - name: "CLA Assistant"
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_TOKEN }}
        with:
          path-to-signatures: "signatures/cla.json"
          path-to-document: "https://github.com/KaranamJyothirmayi/engram/blob/main/CLA.md"
          branch: "cla-signatures"
          allowlist: KaranamJyothirmayi
          create-file-commit-message: "chore: create CLA signatures file"
          signed-commit-message: "chore: CLA signed by @$contributorName"
          custom-notsigned-prcomment: |
            Thank you for your contribution! Before this PR can be merged, please sign our [Contributor License Agreement](https://github.com/KaranamJyothirmayi/engram/blob/main/CLA.md).

            **To sign, post this exact comment:**
            ```
            I have read the CLA Document and I hereby sign the CLA
            ```
            You only need to sign once. Future PRs from your account will be automatically approved.
          custom-pr-sign-comment: "I have read the CLA Document and I hereby sign the CLA"
          custom-allsigned-prcomment: "All contributors have signed the CLA. Thank you!"
          lock-pullrequest-aftermerge: false
